# Installateur des postes secondaires : l'application seule (le serveur est sur le poste principal).
appId: com.somidac.gestion
productName: SOMIDAC
executableName: SOMIDAC
copyright: Copyright © SOMIDAC SARL
directories:
  output: release/poste
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: SOMIDAC-Poste-${version}-Setup.${ext}
nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: SOMIDAC
  deleteAppDataOnUninstall: false
  installerLanguages: [fr_FR]
  language: "1036"
