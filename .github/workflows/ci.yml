name: Intégration continue

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (serveur + poste)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @somidac/shared
      - name: Base PostgreSQL de test
        run: bash scripts/dev-db.sh start
      - run: npm run typecheck -w @somidac/desktop
      - run: node scripts/ci.mjs "Tests serveur" npm test -w @somidac/server
      - run: node scripts/ci.mjs "Tests poste" npm test -w @somidac/desktop

  windows:
    name: Installateurs Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Cache des composants Windows (PostgreSQL, WinSW)
        uses: actions/cache@v4
        with:
          path: .cache/windows
          key: composants-windows-pg18.6-1-winsw2.12.0
      - run: npm ci
      - run: npm run build -w @somidac/shared
      - name: Serveur empaqueté
        run: node scripts/ci.mjs "Empaquetage serveur" npm run empaqueter -w @somidac/server -- ../desktop/ressources-windows/serveur
      - name: Composants Windows
        run: node scripts/ci.mjs "Composants Windows" node scripts/preparer-windows.mjs apps/desktop/ressources-windows
      - run: npm run build -w @somidac/desktop
      - name: Installateur du poste principal
        run: node scripts/ci.mjs "Installateur principal" npm run installateur:principal -w @somidac/desktop
      - name: Installateur des postes secondaires
        run: node scripts/ci.mjs "Installateur poste" npm run installateur:poste -w @somidac/desktop

      - name: Test réel — installation silencieuse du poste principal
        shell: pwsh
        run: |
          $exe = Get-ChildItem apps/desktop/release/principal/*.exe | Select-Object -First 1
          Write-Output "Installation de $($exe.Name)"
          Start-Process $exe.FullName -ArgumentList '/S' -Wait
          Get-Service SOMIDAC-Serveur | Format-List Name, Status, StartType
          $reponse = $null
          for ($i = 0; $i -lt 90; $i++) {
            $reponse = curl.exe -sk --max-time 5 https://127.0.0.1:7443/api/v1/initialisation
            if ($reponse) { break }
            Start-Sleep -Seconds 2
          }
          Write-Output "Réponse du serveur : $reponse"
          if ($reponse -notmatch '"initialise":false') { throw 'Le serveur SOMIDAC ne répond pas après installation' }
          # Les secrets doivent être chiffrés par DPAPI, jamais en clair.
          $secrets = Get-ChildItem "$env:ProgramData\SOMIDAC\secrets"
          $secrets | Format-Table Name, Length
          if ($secrets | Where-Object { $_.Name -eq 'secrets.json' }) { throw 'Secrets en clair détectés' }
          if (-not ($secrets | Where-Object { $_.Name -like '*.dpapi' })) { throw 'Secrets DPAPI absents' }
          # La base ne doit écouter que localement.
          $ecoute = Get-NetTCPConnection -State Listen -LocalPort 5433 -ErrorAction SilentlyContinue
          $ecoute | Format-Table LocalAddress, LocalPort
          if ($ecoute | Where-Object { $_.LocalAddress -ne '127.0.0.1' }) { throw 'PostgreSQL écoute hors de 127.0.0.1' }
          # Arrêt et redémarrage du service.
          Restart-Service SOMIDAC-Serveur
          for ($i = 0; $i -lt 60; $i++) {
            $reponse = curl.exe -sk --max-time 5 https://127.0.0.1:7443/api/v1/sante
            if ($reponse) { break }
            Start-Sleep -Seconds 2
          }
          if ($reponse -notmatch '"statut":"ok"') { throw 'Le serveur ne redémarre pas' }
          Write-Output 'Installation, démarrage et redémarrage du service : OK'

      - name: Test réel — désinstallation (données conservées)
        shell: pwsh
        run: |
          $desinstalleur = Get-ChildItem "$env:ProgramFiles\SOMIDAC\Uninstall*.exe" | Select-Object -First 1
          Start-Process $desinstalleur.FullName -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 10
          if (Get-Service SOMIDAC-Serveur -ErrorAction SilentlyContinue) { throw 'Le service est encore présent' }
          if (-not (Test-Path "$env:ProgramData\SOMIDAC\base\PG_VERSION")) { throw 'Les données ont été supprimées' }
          Write-Output 'Désinstallation : service retiré, données conservées'

      - name: Journaux du service
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem "$env:ProgramData\SOMIDAC\journaux" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Output "===== $($_.Name)"
            Get-Content $_.FullName -Tail 60
          }

      - uses: actions/upload-artifact@v4
        with:
          name: installateurs-windows
          path: |
            apps/desktop/release/principal/*.exe
            apps/desktop/release/poste/*.exe
          retention-days: 30
