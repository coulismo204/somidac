name: Intégration continue

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (serveur + poste)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @somidac/shared
      - name: Base PostgreSQL de test
        run: bash scripts/dev-db.sh start
      - run: npm run typecheck -w @somidac/desktop
      - run: node scripts/ci.mjs "Tests serveur" npm test -w @somidac/server
      - run: node scripts/ci.mjs "Tests poste" npm test -w @somidac/desktop

  windows:
    name: Installateurs Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Cache des composants Windows (PostgreSQL, WinSW)
        uses: actions/cache@v4
        with:
          path: .cache/windows
          key: composants-windows-pg18.6-1-winsw2.12.0-vcredist
      - run: npm ci
      - run: npm run build -w @somidac/shared
      - name: Serveur empaqueté
        run: node scripts/ci.mjs "Empaquetage serveur" npm run empaqueter -w @somidac/server -- ../desktop/ressources-windows/serveur
      - name: Composants Windows
        run: node scripts/ci.mjs "Composants Windows" node scripts/preparer-windows.mjs apps/desktop/ressources-windows
      - run: npm run build -w @somidac/desktop
      - name: Installateur (unique, tous les PC)
        run: node scripts/ci.mjs "Installateur" npm run installateur -w @somidac/desktop

      - name: Test réel - installation silencieuse, puis activation du poste principal
        shell: pwsh
        run: |
          $exe = Get-ChildItem apps/desktop/release/*.exe | Select-Object -First 1
          Write-Output "Installation de $($exe.Name)"
          Start-Process $exe.FullName -ArgumentList '/S' -Wait
          # Après installation : service présent mais arrêté (aucun PC n'est principal par défaut).
          $service = Get-Service SOMIDAC-Serveur
          $service | Format-List Name, Status, StartType
          if ($service.Status -ne 'Stopped') { throw 'Le service ne doit pas démarrer avant le choix du poste principal' }
          # Ce que fait le bouton « Faire de ce PC le poste principal » (ici déjà administrateur).
          & cmd.exe /c "`"$env:ProgramFiles\SOMIDAC\resources\service\activer-poste-principal.cmd`""
          $reponse = $null
          for ($i = 0; $i -lt 90; $i++) {
            $reponse = curl.exe -sk --max-time 5 https://127.0.0.1:7443/api/v1/initialisation
            if ($reponse) { break }
            Start-Sleep -Seconds 2
          }
          Write-Output "Réponse du serveur : $reponse"
          if ($reponse -notmatch '"initialise":false') { throw 'Le serveur SOMIDAC ne répond pas après activation' }
          if ((Get-Service SOMIDAC-Serveur).StartType -ne 'Automatic') { throw 'Le service doit démarrer avec Windows une fois activé' }
          if (-not (Get-NetFirewallRule -DisplayName 'SOMIDAC Serveur' -ErrorAction SilentlyContinue)) { throw 'Règle de pare-feu absente' }
          # Découverte : le poste principal répond aux recherches sur le réseau (UDP 7444).
          $udp = New-Object System.Net.Sockets.UdpClient
          $udp.Client.ReceiveTimeout = 5000
          $octets = [Text.Encoding]::UTF8.GetBytes('SOMIDAC-DECOUVERTE-1')
          [void]$udp.Send($octets, $octets.Length, '127.0.0.1', 7444)
          $distant = New-Object System.Net.IPEndPoint([System.Net.IPAddress]::Any, 0)
          $decouverte = [Text.Encoding]::UTF8.GetString($udp.Receive([ref]$distant))
          $udp.Close()
          Write-Output "Découverte : $decouverte"
          if ($decouverte -notmatch '"application":"somidac"') { throw 'Pas de réponse à la découverte réseau' }
          # Les secrets doivent être chiffrés par DPAPI, jamais en clair.
          $secrets = Get-ChildItem "$env:ProgramData\SOMIDAC\secrets"
          $secrets | Format-Table Name, Length
          if ($secrets | Where-Object { $_.Name -eq 'secrets.json' }) { throw 'Secrets en clair détectés' }
          if (-not ($secrets | Where-Object { $_.Name -like '*.dpapi' })) { throw 'Secrets DPAPI absents' }
          # La base ne doit écouter que localement.
          $ecoute = Get-NetTCPConnection -State Listen -LocalPort 5433 -ErrorAction SilentlyContinue
          $ecoute | Format-Table LocalAddress, LocalPort
          if ($ecoute | Where-Object { $_.LocalAddress -ne '127.0.0.1' }) { throw 'PostgreSQL écoute hors de 127.0.0.1' }
          # Arrêt et redémarrage du service.
          Restart-Service SOMIDAC-Serveur
          for ($i = 0; $i -lt 60; $i++) {
            $reponse = curl.exe -sk --max-time 5 https://127.0.0.1:7443/api/v1/sante
            if ($reponse) { break }
            Start-Sleep -Seconds 2
          }
          if ($reponse -notmatch '"statut":"ok"') { throw 'Le serveur ne redémarre pas' }
          Write-Output 'Installation, activation, découverte et redémarrage : OK'

      - name: Test réel - mise à jour du poste principal (droits cassés réparés, réactivé tout seul)
        shell: pwsh
        run: |
          # Reproduit l'état laissé par les versions 0.1.x / 0.2.0 : un secret appartenant au service,
          # sans plus aucun droit pour personne (même les administrateurs ne peuvent plus le lire).
          Stop-Service SOMIDAC-Serveur
          $f = "$env:ProgramData\SOMIDAC\secrets\motDePasseBase.dpapi"
          icacls $f /setowner '*S-1-5-20' | Out-Null
          icacls $f /inheritance:r | Out-Null
          icacls $f /remove:g '*S-1-5-32-544' '*S-1-5-18' '*S-1-5-20' | Out-Null
          $exe = Get-ChildItem apps/desktop/release/*.exe | Select-Object -First 1
          Start-Process $exe.FullName -ArgumentList '/S' -Wait
          $reponse = $null
          for ($i = 0; $i -lt 90; $i++) {
            $reponse = curl.exe -sk --max-time 5 https://127.0.0.1:7443/api/v1/sante
            if ($reponse) { break }
            Start-Sleep -Seconds 2
          }
          if ($reponse -notmatch '"statut":"ok"') { throw 'Le poste principal ne redémarre pas après mise à jour' }
          Write-Output 'Mise à jour : serveur réactivé'

      - name: Test réel - désinstallation (données conservées)
        shell: pwsh
        run: |
          $desinstalleur = Get-ChildItem "$env:ProgramFiles\SOMIDAC\Uninstall*.exe" | Select-Object -First 1
          Start-Process $desinstalleur.FullName -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 10
          if (Get-Service SOMIDAC-Serveur -ErrorAction SilentlyContinue) { throw 'Le service est encore présent' }
          if (Get-NetFirewallRule -DisplayName 'SOMIDAC Serveur' -ErrorAction SilentlyContinue) { throw 'Règle de pare-feu encore présente' }
          if (-not (Test-Path "$env:ProgramData\SOMIDAC\base\PG_VERSION")) { throw 'Les données ont été supprimées' }
          Write-Output 'Désinstallation : service retiré, données conservées'

      - name: Diagnostic du service (en cas d'échec)
        if: failure()
        shell: pwsh
        run: ./scripts/diagnostic-windows.ps1 'Installation Windows'

      - uses: actions/upload-artifact@v4
        with:
          name: installateurs-windows
          path: apps/desktop/release/*.exe
          retention-days: 30
